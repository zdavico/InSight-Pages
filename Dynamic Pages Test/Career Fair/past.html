<!-- Every link opens in a new tab so nothing loads inside the Canvas iframe -->
<base target="_blank" />
<style>
  /* Match Canvas typography so the frame blends into the page */
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: "Lato Extended", "Lato", "Helvetica Neue", Helvetica, Arial, sans-serif; color: #2d3b45; line-height: 1.5; padding: 6px 6px 2px; }
  /* Fade + label at the bottom of the frame signal there is more to scroll */
  .scroll-fade { position: fixed; left: 0; right: 0; bottom: 0; height: 110px; pointer-events: none;
                  display: flex; align-items: flex-end; justify-content: center; padding-bottom: 12px; box-sizing: border-box;
                  background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,0.85) 55%, #ffffff 100%);
                  transition: opacity 0.25s; }
  .scroll-fade.is-hidden { opacity: 0; }
  .scroll-fade-label { background: #6c757d; color: #ffffff; font-size: 13px; font-weight: bold; padding: 6px 16px;
                        border-radius: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
  .scroll-fade-arrow { display: inline-block; margin-left: 6px; animation: nudge 1.6s ease-in-out infinite; }
  @keyframes nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
  @media (prefers-reduced-motion: reduce) { .scroll-fade { transition: none; } .scroll-fade-arrow { animation: none; } }
</style>
</head>

<div class="scroll-fade" aria-hidden="true"><span class="scroll-fade-label">Scroll for more past events<span class="scroll-fade-arrow">&darr;</span></span></div>
<script>
(function () {
  var fade = document.querySelector(".scroll-fade");
  function update() {
    var el = document.documentElement;
    var atEnd = el.scrollTop + window.innerHeight >= el.scrollHeight - 8;
    fade.classList.toggle("is-hidden", atEnd);
  }
  window.addEventListener("scroll", update, { passive: true });
  window.addEventListener("resize", update);
  window.addEventListener("load", update);
  update();
})();
</script>
